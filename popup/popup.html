<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Griot</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- The woven triangle strip along the top edge -->
  <div class="border-strip" aria-hidden="true"></div>

  <!-- Screen 1: home, your parked threads -->
  <div id="home-screen" class="screen">
    <header class="header">
      <img class="wordmark" src="../assets/brand/griot-wordmark.svg" alt="Griot">
      <!-- Settings come in a later milestone; the button is here so the header matches the design -->
      <button type="button" class="icon-button" aria-label="Privacy and settings" aria-disabled="true" title="Settings are coming soon">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="10" r="2.5"></circle><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M4.7 15.3l1.4-1.4M13.9 6.1l1.4-1.4"></path></svg>
      </button>
    </header>

    <main class="main">
      <h1 class="title">Pick up where you left off</h1>
      <!-- Shown for a moment after parking -->
      <p id="parked-message" class="saved-message" role="status" hidden>
        <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5l4 4 8-9"></path></svg>
        <span id="parked-message-text">Thread parked.</span>
      </p>
      <!-- popup.js fills this with one card per parked thread -->
      <div id="thread-list" class="thread-list"></div>
    </main>

    <footer class="footer">
      <button type="button" id="open-park-card" class="button button-secondary">Park the thread I'm on</button>
      <p class="privacy-line">
        <svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="9" width="12" height="8" rx="2"></rect><path d="M7 9V6.5a3 3 0 0 1 6 0V9"></path></svg>
        Everything stays on this device.
      </p>
    </footer>
  </div>

  <!-- Screen 2: the park card for the current window -->
  <form id="park-screen" class="screen park" hidden>
    <div class="park-eyebrow-row">
      <img src="../assets/brand/griot-mark.svg" alt="" class="park-mark">
      <span class="eyebrow">This window</span>
    </div>

    <h1 class="title">Where were you headed?</h1>

    <div class="field">
      <label for="park-note" class="field-label">Your note</label>
      <textarea id="park-note" class="note-input" rows="2"></textarea>
      <span id="park-guess-hint" class="caption">Griot's guess from your tab titles. Make it yours.</span>
    </div>

    <div class="field">
      <label for="park-next" class="field-label">
        <span class="next-dot" aria-hidden="true"></span>
        Next step <span class="optional">(optional)</span>
      </label>
      <input id="park-next" class="text-input" type="text">
    </div>

    <!-- The window's tabs. Only ticked tabs are saved with the thread -->
    <fieldset class="park-tabs">
      <legend class="field-label">Tabs in this thread <span id="park-tab-count" class="optional"></span></legend>
      <ul id="park-tab-list" class="park-tab-list"></ul>
    </fieldset>

    <div class="park-actions">
      <button type="button" id="park-not-now" class="button button-secondary">Not now</button>
      <button type="submit" id="park-submit" class="button button-primary">Park thread</button>
    </div>
  </form>

  <!-- Screen 3: one thread's detail and trail -->
  <div id="detail-screen" class="screen" hidden>
    <header class="detail-header">
      <button type="button" id="detail-back" class="back-button">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.5 4.5 7 10l5.5 5.5"></path></svg>
        All threads
      </button>
      <span id="detail-parked-time" class="caption"></span>
    </header>

    <div class="detail-body">
      <p id="detail-note" class="detail-note"></p>
      <div id="detail-next"></div>

      <section class="trail-panel" aria-labelledby="trail-heading">
        <h2 id="trail-heading" class="eyebrow"></h2>
        <ol id="trail-list" class="trail-list"></ol>
        <span id="trail-hidden-count" class="caption"></span>
      </section>
    </div>

    <!-- Reopen, Mark done and Delete; Delete asks first -->
    <div id="detail-actions" class="detail-actions">
      <button type="button" id="detail-reopen" class="button button-primary"></button>
      <button type="button" id="detail-done" class="button button-secondary">Mark done</button>
      <button type="button" id="detail-delete" class="button button-danger">Delete</button>
    </div>
    <div id="delete-confirm" class="delete-confirm" hidden>
      <p class="delete-question">Delete this thread? This can't be undone.</p>
      <div class="delete-confirm-buttons">
        <button type="button" id="delete-cancel" class="button button-secondary">Cancel</button>
        <button type="button" id="delete-yes" class="button button-danger-solid">Delete</button>
      </div>
    </div>
  </div>

  <script src="../lib/threads.js"></script>
  <script src="../lib/storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
