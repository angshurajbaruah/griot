<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Griot privacy and settings</title>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&amp;family=Josefin+Sans:wght@400;600&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&amp;display=swap">
<style>
body{margin:0}
a{color:#3E2A1C}a:hover{color:#A64F2E}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #3E2A1C;outline-offset:2px}
.band{background-image:url(../../assets/brand/border-triangles.svg);background-repeat:repeat-x;background-size:28px 14px}
.cloth{background-image:url(../../assets/brand/border-hatch.svg);background-repeat:repeat-x;background-size:32px 16px}
</style>
<div style="width: 380px; height: 600px; box-sizing: border-box; background: #F4EBDD; color: #3E2A1C; font-family: 'Instrument Sans', ui-sans-serif, sans-serif; display: flex; flex-direction: column;">
  <div class="band" style="height: 14px; flex-shrink: 0;" aria-hidden="true"></div>

  <header style="display: flex; align-items: center; gap: 4px; padding: 8px 12px; border-bottom: 1px solid #D9C7A7;">
    <a href="3-home.html" aria-label="Back to threads" style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 8px; color: #3E2A1C;">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.5 4.5 7 10l5.5 5.5"></path></svg>
    </a>
    <h1 style="margin: 0; font-size: 22px; line-height: 26px; font-family: 'BackOut', 'Josefin Sans', ui-sans-serif, sans-serif; font-weight: 400; letter-spacing: 0.02em;">Privacy and settings</h1>
  </header>

  <div style="padding: 14px 16px 14px; display: flex; flex-direction: column; gap: 16px; flex-grow: 1;">
    <div style="background: #3E2A1C; color: #F2E6D0; border-radius: 12px; padding: 14px; display: flex; gap: 12px; align-items: flex-start;">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#D9AE52" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px;"><rect x="4" y="9" width="12" height="8" rx="2"></rect><path d="M7 9V6.5a3 3 0 0 1 6 0V9"></path></svg>
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <strong style="font-family: 'Source Serif 4', Georgia, serif; font-size: 16px; line-height: 22px; font-weight: 600;">Everything stays on this device.</strong>
        <span style="font-size: 13px; line-height: 18px;">Griot saves tab titles, links, times and your notes. It never reads your pages and sends nothing anywhere.</span>
      </div>
    </div>

    <section style="display: flex; flex-direction: column; gap: 4px;">
      <h2 style="margin: 0 0 4px; font-family: 'BackOut', 'Josefin Sans', ui-sans-serif, sans-serif; font-size: 13px; line-height: 16px; font-weight: 400; letter-spacing: 0.1em; text-transform: uppercase; color: #6B5442;">When to ask</h2>
      <label style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 36px; font-size: 14px; line-height: 20px;">
        When I'm idle for 10 minutes
        <input type="checkbox" checked style="width: 18px; height: 18px; margin: 0; accent-color: #3E2A1C;">
      </label>
      <label style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 36px; font-size: 14px; line-height: 20px;">
        When I close a window
        <input type="checkbox" checked style="width: 18px; height: 18px; margin: 0; accent-color: #3E2A1C;">
      </label>
      <label style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 36px; font-size: 14px; line-height: 20px;">
        Pause Griot for today
        <input type="checkbox" style="width: 18px; height: 18px; margin: 0; accent-color: #3E2A1C;">
      </label>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px;">
      <h2 style="margin: 0; font-family: 'BackOut', 'Josefin Sans', ui-sans-serif, sans-serif; font-size: 13px; line-height: 16px; font-weight: 400; letter-spacing: 0.1em; text-transform: uppercase; color: #6B5442;">Never track these sites</h2>
      <div style="display: flex; flex-wrap: wrap; gap: 6px;">
        <span style="display: inline-flex; align-items: center; gap: 6px; background: #E8D7B7; border-radius: 4px; padding: 4px 4px 4px 10px; font-size: 13px; line-height: 18px;">Banking and health sites <span style="color: #6B5442;">(default)</span></span>
        <span style="display: inline-flex; align-items: center; gap: 2px; background: #E8D7B7; border-radius: 4px; padding: 4px 2px 4px 10px; font-size: 13px; line-height: 18px;">web.whatsapp.com <button type="button" aria-label="Remove web.whatsapp.com" style="width: 24px; height: 24px; border: 0; background: transparent; color: #6B5442; cursor: pointer; font-size: 14px;">×</button></span>
      </div>
      <button type="button" style="align-self: flex-start; height: 36px; padding: 0 12px; border: 1px solid #8C765A; border-radius: 8px; background: #FBF6EE; color: #3E2A1C; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;">Add a site</button>
    </section>

    <div style="margin-top: auto; padding-top: 12px; border-top: 1px solid #D9C7A7; display: flex; align-items: center; justify-content: space-between;">
      <button type="button" style="height: 36px; padding: 0; border: 0; background: transparent; color: #8E2F1C; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;">Delete all threads and trails</button>
      <span style="font-size: 12px; line-height: 16px; color: #6B5442;">Griot 0.1 · open source</span>
    </div>
  </div>
</div>
</body>
</html>
